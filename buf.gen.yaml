version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: bufdemo/gen
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.6
    out: gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: gen
    opt: paths=source_relative
inputs:
  - directory: proto